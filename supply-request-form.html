<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฟอร์มเบิกอุปกรณ์สำนักงาน | Office Supply Request</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Noto+Sans+Myanmar:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans Thai','Noto Sans Myanmar',sans-serif;background:#f1f5f9}
.card{background:white;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.lang-btn{padding:6px 14px;border-radius:8px;border:1px solid #ddd;font-size:14px}
.lang-active{background:#4f46e5;color:white;border-color:#4f46e5}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 10px;font-size:13px;margin:3px}
.chip button{color:#dc2626;font-weight:700;line-height:1}
.hidden{display:none!important}
</style>
</head>
<body class="p-6">
<div class="max-w-6xl mx-auto">

<div id="errorBanner" class="hidden mb-4 text-sm bg-red-50 border border-red-300 text-red-800 rounded-lg p-3"></div>

<div class="flex justify-between items-center mb-6 gap-3 flex-wrap">
  <h1 id="title" class="text-2xl font-semibold">แบบฟอร์มเบิกอุปกรณ์สำนักงาน</h1>
  <div class="flex gap-2 items-center">
    <span id="authStatus" class="text-sm text-gray-500">กำลังเชื่อมต่อ...</span>
    <button onclick="openAdminLogin()" id="btn-admin" class="bg-slate-800 text-white px-3 py-2 rounded-lg text-sm">🔐 Admin</button>
    <button onclick="adminLogout()" id="btn-logout" class="hidden bg-gray-500 text-white px-3 py-2 rounded-lg text-sm">ออกจากระบบ</button>
    <button onclick="setLang('th')" id="btn-th" class="lang-btn lang-active">ไทย</button>
    <button onclick="setLang('mm')" id="btn-mm" class="lang-btn">မြန်မာ</button>
  </div>
</div>

<div id="adminBanner" class="hidden mb-4 text-sm bg-green-50 border border-green-300 text-green-800 rounded-lg p-3">
  🔐 <b>Admin Mode</b> — สามารถแก้ไข ลบ ย้ายถังขยะ และกู้คืนข้อมูลได้
</div>

<div class="card p-6 mb-6">
<div id="editingBanner" class="hidden mb-4 text-sm bg-amber-50 border border-amber-300 text-amber-800 rounded-lg p-3 flex justify-between items-center">
  <span id="editingBannerText">กำลังแก้ไขรายการ</span>
  <button type="button" onclick="cancelEdit()" id="btn-cancel-edit" class="text-amber-800 underline">ยกเลิก</button>
</div>

<form id="request-form" class="space-y-4">
<div>
<label id="lbl-dept" class="text-sm font-medium">แผนก</label>
<input id="department" class="mt-1 w-full border rounded-lg p-2" placeholder="เช่น บัญชี" required>
</div>

<div>
<label id="lbl-items" class="text-sm font-medium">รายการที่ต้องการเบิก</label>
<div class="mt-1 flex gap-2">
<input id="itemNameInput" class="flex-1 border rounded-lg p-2" placeholder="ชื่อรายการ เช่น กระดาษ A4">
<input id="itemQtyInput" type="number" min="1" class="w-24 border rounded-lg p-2" placeholder="จำนวน">
<button type="button" onclick="addItem()" id="btn-add-item" class="bg-indigo-100 text-indigo-700 px-3 rounded-lg whitespace-nowrap">+ เพิ่ม</button>
</div>
<div id="itemsChips" class="mt-2"></div>
</div>

<div>
<label id="lbl-name" class="text-sm font-medium">ชื่อผู้เบิก</label>
<input id="requesterName" class="mt-1 w-full border rounded-lg p-2" required>
</div>

<button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700" id="btn-submit">ส่งรายการ</button>
</form>
</div>

<div class="flex justify-between gap-2 mb-4 flex-wrap">
  <div class="flex gap-2">
    <button onclick="downloadCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm" id="btn-download">ดาวน์โหลด</button>
    <button onclick="openTrash()" class="hidden bg-orange-500 text-white px-4 py-2 rounded-lg text-sm" id="btn-trash">🗑️ ถังขยะ</button>
  </div>
  <button onclick="deleteAll()" class="hidden bg-red-600 text-white px-4 py-2 rounded-lg text-sm" id="btn-deleteall">ลบทั้งหมด</button>
</div>

<div class="card p-6">
<h2 id="title-list" class="text-lg font-semibold mb-4">รายการเบิกทั้งหมด</h2>
<div class="overflow-x-auto">
<table class="w-full text-sm">
<thead class="border-b bg-gray-50">
<tr>
<th class="p-2 text-left" id="th-name">ชื่อ</th>
<th class="p-2 text-left" id="th-dept">แผนก</th>
<th class="p-2 text-left" id="th-items">รายการ</th>
<th class="p-2 text-left" id="th-status">สถานะ</th>
<th class="p-2 text-left" id="th-time">เวลา</th>
<th class="p-2 text-left" id="th-action">การดำเนินการ</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<!-- Admin login -->
<div id="adminModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
<h2 class="text-xl font-semibold mb-4">🔐 Admin Login</h2>
<p class="text-sm text-gray-500 mb-4">ใช้บัญชี Firebase Authentication ของผู้ดูแล</p>
<input id="adminEmail" type="email" class="w-full border rounded-lg p-2 mb-3" placeholder="อีเมล Admin">
<input id="adminPassword" type="password" class="w-full border rounded-lg p-2 mb-4" placeholder="รหัสผ่าน">
<div class="flex gap-2">
<button onclick="adminLogin()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg">เข้าสู่ระบบ</button>
<button onclick="closeAdminLogin()" class="flex-1 bg-gray-200 py-2 rounded-lg">ยกเลิก</button>
</div>
</div>
</div>

<!-- Trash -->
<div id="trashModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-6 w-full max-w-5xl max-h-[90vh] overflow-auto shadow-xl">
<div class="flex justify-between items-center mb-4">
<h2 class="text-xl font-semibold">🗑️ ถังขยะ / กู้คืนรายการ</h2>
<button onclick="closeTrash()" class="text-gray-500 text-xl">✕</button>
</div>
<div id="trashBody"></div>
</div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyASVRfcI29rcxgzQuOC6R-CMT7X7vBWg_g",
 authDomain:"onlinetoolbox-d7c04.firebaseapp.com",
 projectId:"onlinetoolbox-d7c04",
 storageBucket:"onlinetoolbox-d7c04.appspot.com",
 messagingSenderId:"873410566683",
 appId:"1:873410566683:web:6c7e3058085b09acb036be"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();

const collectionPath="supply-requests";
const trashPath="supply-trash";

const form=document.getElementById("request-form");
const tableBody=document.getElementById("tableBody");
let formItems=[];
let editingId=null;
let latestDocs={};
let currentLang="th";
let isAdmin=false;
let unsubscribe=null;

const lang={
th:{
 title:"แบบฟอร์มเบิกอุปกรณ์สำนักงาน",dept:"แผนก",items:"รายการที่ต้องการเบิก",name:"ชื่อผู้เบิก",
 submit:"ส่งรายการ",saveEdit:"บันทึกการแก้ไข",list:"รายการเบิกทั้งหมด",thname:"ชื่อ",thdept:"แผนก",
 thitems:"รายการ",thstatus:"สถานะ",thtime:"เวลา",thaction:"การดำเนินการ",addItem:"+ เพิ่ม",
 download:"ดาวน์โหลด",deleteAll:"ลบทั้งหมด",editingBanner:"กำลังแก้ไขรายการนี้อยู่",cancelEdit:"ยกเลิก",
 passcodeWrong:"รหัสไม่ถูกต้อง",fillItemAlert:"กรุณากรอกชื่อรายการและจำนวน",
 fillFormAlert:"กรุณากรอกข้อมูลให้ครบและเพิ่มอย่างน้อย 1 รายการ",
 confirmDeleteAll:"ยืนยันย้ายรายการทั้งหมดเข้าถังขยะหรือไม่",
 confirmDeleteOne:"ยืนยันย้ายรายการนี้เข้าถังขยะหรือไม่"
},
mm:{
 title:"ရုံးသုံးပစ္စည်း ထုတ်ယူရန် ဖောင်",dept:"ဌာန",items:"လိုအပ်သောပစ္စည်း",name:"တောင်းဆိုသူအမည်",
 submit:"တင်ပြရန်",saveEdit:"ပြင်ဆင်ချက်ကို သိမ်းရန်",list:"တောင်းဆိုမှုစာရင်း",thname:"အမည်",thdept:"ဌာန",
 thitems:"ပစ္စည်း",thstatus:"အခြေအနေ",thtime:"အချိန်",thaction:"လုပ်ဆောင်ချက်",addItem:"+ ထည့်ရန်",
 download:"ဒေါင်းလုဒ်",deleteAll:"အားလုံးဖျက်ရန်",editingBanner:"ဤစာရင်းကို ပြင်ဆင်နေသည်",cancelEdit:"ပယ်ဖျက်ရန်",
 passcodeWrong:"ကုဒ်မှားနေသည်",fillItemAlert:"ပစ္စည်းအမည်နှင့်အရေအတွက်ကို ဖြည့်ပါ",
 fillFormAlert:"အချက်အလက်အားလုံးဖြည့်ပြီး ပစ္စည်းအနည်းဆုံး ၁ ခု ထည့်ပါ",
 confirmDeleteAll:"အားလုံးကို အမှိုက်ပုံးထဲသို့ ရွှေ့မည်လား",
 confirmDeleteOne:"ဤစာရင်းကို အမှိုက်ပုံးထဲသို့ ရွှေ့မည်လား"
}};

function showError(msg){
 const el=document.getElementById("errorBanner");
 el.innerText="เชื่อมต่อระบบไม่สำเร็จ: "+msg;
 el.classList.remove("hidden");
 console.error(msg);
}
function clearError(){document.getElementById("errorBanner").classList.add("hidden");}

auth.onAuthStateChanged(async user=>{
 clearError();
 if(!user){
   await auth.signInAnonymously();
   return;
 }
 await refreshAdminState(user);
 startListening();
});

async function refreshAdminState(user){
 isAdmin=false;
 if(user && !user.isAnonymous){
   const u=await db.collection("users").doc(user.uid).get();
   isAdmin=!!(u.exists && u.data().admin===true);
 }
 document.getElementById("authStatus").innerText=isAdmin?"🔐 Admin":"👤 พนักงาน";
 document.getElementById("adminBanner").classList.toggle("hidden",!isAdmin);
 document.getElementById("btn-admin").classList.toggle("hidden",isAdmin);
 document.getElementById("btn-logout").classList.toggle("hidden",!isAdmin);
 document.getElementById("btn-trash").classList.toggle("hidden",!isAdmin);
 document.getElementById("btn-deleteall").classList.toggle("hidden",!isAdmin);
 renderRows();
}

function startListening(){
 if(unsubscribe) unsubscribe();
 unsubscribe=db.collection(collectionPath).orderBy("timestamp","desc").onSnapshot(snap=>{
   latestDocs={};
   snap.forEach(d=>latestDocs[d.id]=d.data());
   renderRows();
 },err=>showError(err.code?`${err.code} - ${err.message}`:err.message));
}

function renderRows(){
 tableBody.innerHTML="";
 Object.entries(latestDocs).forEach(([id,data])=>{
   const tr=document.createElement("tr");
   tr.className="border-b";
   const statusText=data.complete?"✅ ครบ":"⏳ รอดำเนินการ";
   const statusColor=data.complete?"bg-green-600":"bg-yellow-500";
   const time=data.timestamp?.toMillis?new Date(data.timestamp.toMillis()).toLocaleString("th-TH"):"-";
   const itemsDisplay=Array.isArray(data.itemsList)?data.itemsList.map(it=>`${escapeHtml(it.name)} (${escapeHtml(it.qty)})`).join(", "):(data.items||"-");
   tr.innerHTML=`
<td class="p-2">${escapeHtml(data.requesterName||"")}</td>
<td class="p-2">${escapeHtml(data.department||"")}</td>
<td class="p-2">${itemsDisplay}</td>
<td class="p-2"><button class="${statusColor} text-white px-2 py-1 rounded text-xs">${statusText}</button></td>
<td class="p-2">${time}</td>
<td class="p-2 flex gap-2">
<button class="bg-blue-600 text-white px-2 py-1 rounded text-xs action-complete">✔</button>
<button class="bg-gray-500 text-white px-2 py-1 rounded text-xs action-pending">↺</button>
${isAdmin?'<button class="bg-amber-500 text-white px-2 py-1 rounded text-xs action-edit">✎</button><button class="bg-red-600 text-white px-2 py-1 rounded text-xs action-delete">🗑</button>':""}
</td>`;
   tr.querySelector(".action-complete").onclick=()=>db.collection(collectionPath).doc(id).update({complete:true});
   tr.querySelector(".action-pending").onclick=()=>db.collection(collectionPath).doc(id).update({complete:false});
   if(isAdmin){
     tr.querySelector(".action-edit").onclick=()=>startEdit(id);
     tr.querySelector(".action-delete").onclick=()=>startDelete(id);
   }
   tableBody.appendChild(tr);
 });
}

function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function addItem(){
 const nameEl=document.getElementById("itemNameInput"),qtyEl=document.getElementById("itemQtyInput");
 const name=nameEl.value.trim(),qty=qtyEl.value.trim();
 if(!name||!qty||Number(qty)<=0){alert(lang[currentLang].fillItemAlert);return;}
 formItems.push({name,qty});
 nameEl.value="";qtyEl.value="";nameEl.focus();renderChips();
}
function renderChips(){
 const box=document.getElementById("itemsChips");box.innerHTML="";
 formItems.forEach((it,idx)=>{
   const chip=document.createElement("span");chip.className="chip";
   chip.innerHTML=`${escapeHtml(it.name)} (${escapeHtml(it.qty)}) <button type="button">×</button>`;
   chip.querySelector("button").onclick=()=>{formItems.splice(idx,1);renderChips()};
   box.appendChild(chip);
 });
}

form.addEventListener("submit",async e=>{
 e.preventDefault();
 const department=document.getElementById("department").value.trim();
 const requesterName=document.getElementById("requesterName").value.trim();
 if(!department||!requesterName||formItems.length===0){alert(lang[currentLang].fillFormAlert);return;}
 try{
   if(editingId){
     if(!isAdmin){alert("เฉพาะ Admin เท่านั้น");return;}
     await db.collection(collectionPath).doc(editingId).update({department,requesterName,itemsList:formItems,lastEditedAt:firebase.firestore.FieldValue.serverTimestamp(),lastEditedBy:auth.currentUser.uid});
     cancelEdit();
   }else{
     await db.collection(collectionPath).add({department,requesterName,itemsList:formItems,complete:false,timestamp:firebase.firestore.FieldValue.serverTimestamp(),createdBy:auth.currentUser.uid});
   }
   form.reset();formItems=[];renderChips();
 }catch(err){showError(err.code?`${err.code} - ${err.message}`:err.message);}
});

function startEdit(id){
 if(!isAdmin)return;
 const data=latestDocs[id];if(!data)return;
 document.getElementById("department").value=data.department||"";
 document.getElementById("requesterName").value=data.requesterName||"";
 formItems=Array.isArray(data.itemsList)?JSON.parse(JSON.stringify(data.itemsList)):[];
 renderChips();editingId=id;
 document.getElementById("editingBanner").classList.remove("hidden");
 document.getElementById("btn-submit").innerText=lang[currentLang].saveEdit;
 window.scrollTo({top:0,behavior:"smooth"});
}
function cancelEdit(){
 editingId=null;formItems=[];renderChips();form.reset();
 document.getElementById("editingBanner").classList.add("hidden");
 document.getElementById("btn-submit").innerText=lang[currentLang].submit;
}

async function moveToTrash(id){
 if(!isAdmin){alert("ไม่มีสิทธิ์");return;}
 const ref=db.collection(collectionPath).doc(id);
 const snap=await ref.get();
 if(!snap.exists)return;
 const trashRef=db.collection(trashPath).doc(id);
 const data=snap.data();
 await trashRef.set({...data,originalId:id,deletedAt:firebase.firestore.FieldValue.serverTimestamp(),deletedBy:auth.currentUser.uid});
 await ref.delete();
}
async function startDelete(id){
 if(!isAdmin)return;
 if(!confirm(lang[currentLang].confirmDeleteOne))return;
 try{await moveToTrash(id);if(editingId===id)cancelEdit();}
 catch(err){showError(err.code?`${err.code} - ${err.message}`:err.message);}
}

async function deleteAll(){
 if(!isAdmin)return;
 if(!confirm(lang[currentLang].confirmDeleteAll))return;
 try{
   const snap=await db.collection(collectionPath).get();
   const batch=db.batch();
   snap.forEach(d=>{
     const trashRef=db.collection(trashPath).doc(d.id);
     batch.set(trashRef,{...d.data(),originalId:d.id,deletedAt:firebase.firestore.FieldValue.serverTimestamp(),deletedBy:auth.currentUser.uid});
     batch.delete(d.ref);
   });
   await batch.commit();
 }catch(err){showError(err.code?`${err.code} - ${err.message}`:err.message);}
}

async function openTrash(){
 if(!isAdmin)return;
 document.getElementById("trashModal").classList.remove("hidden");
 const body=document.getElementById("trashBody");
 body.innerHTML='<div class="text-gray-500">กำลังโหลด...</div>';
 try{
   const snap=await db.collection(trashPath).orderBy("deletedAt","desc").get();
   if(snap.empty){body.innerHTML='<div class="text-gray-500">ถังขยะว่าง</div>';return;}
   body.innerHTML="";
   snap.forEach(d=>{
     const x=d.data();
     const time=x.deletedAt?.toMillis?new Date(x.deletedAt.toMillis()).toLocaleString("th-TH"):"-";
     const items=Array.isArray(x.itemsList)?x.itemsList.map(it=>`${escapeHtml(it.name)} (${escapeHtml(it.qty)})`).join(", "):"";
     const div=document.createElement("div");
     div.className="border rounded-xl p-4 mb-3";
     div.innerHTML=`<div class="font-semibold">${escapeHtml(x.requesterName||"")} — ${escapeHtml(x.department||"")}</div>
<div class="text-sm text-gray-600 mt-1">${items}</div>
<div class="text-xs text-gray-400 mt-2">ลบเมื่อ: ${time}</div>
<div class="flex gap-2 mt-3"><button class="bg-green-600 text-white px-3 py-2 rounded-lg text-sm restore">🔄 กู้คืน</button><button class="bg-red-600 text-white px-3 py-2 rounded-lg text-sm permanent">ลบถาวร</button></div>`;
     div.querySelector(".restore").onclick=()=>restoreItem(d.id);
     div.querySelector(".permanent").onclick=()=>permanentDelete(d.id);
     body.appendChild(div);
   });
 }catch(err){body.innerHTML='<div class="text-red-600">โหลดถังขยะไม่สำเร็จ</div>';showError(err.code?`${err.code} - ${err.message}`:err.message);}
}
function closeTrash(){document.getElementById("trashModal").classList.add("hidden");}
async function restoreItem(id){
 if(!isAdmin)return;
 if(!confirm("กู้คืนรายการนี้กลับเข้าสู่รายการปกติหรือไม่"))return;
 try{
   const trashRef=db.collection(trashPath).doc(id),snap=await trashRef.get();
   if(!snap.exists)return;
   const x=snap.data();
   const restored={...x};delete restored.deletedAt;delete restored.deletedBy;delete restored.originalId;
   restored.restoredAt=firebase.firestore.FieldValue.serverTimestamp();
   restored.restoredBy=auth.currentUser.uid;
   await db.collection(collectionPath).doc(id).set(restored);
   await trashRef.delete();openTrash();
 }catch(err){showError(err.code?`${err.code} - ${err.message}`:err.message);}
}
async function permanentDelete(id){
 if(!isAdmin)return;
 if(!confirm("คำเตือน: ลบถาวรแล้วจะไม่สามารถกู้คืนจากถังขยะได้ ยืนยันหรือไม่"))return;
 try{await db.collection(trashPath).doc(id).delete();openTrash();}
 catch(err){showError(err.code?`${err.code} - ${err.message}`:err.message);}
}

function openAdminLogin(){document.getElementById("adminModal").classList.remove("hidden");}
function closeAdminLogin(){document.getElementById("adminModal").classList.add("hidden");}
async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;
 if(!email||!password){alert("กรุณากรอกอีเมลและรหัสผ่าน");return;}
 try{
   const cred=await auth.signInWithEmailAndPassword(email,password);
   const u=await db.collection("users").doc(cred.user.uid).get();
   if(!u.exists||u.data().admin!==true){
     await auth.signOut();
     alert("บัญชีนี้ยังไม่ได้รับสิทธิ์ Admin");
     return;
   }
   closeAdminLogin();await refreshAdminState(cred.user);startListening();
 }catch(err){alert("เข้าสู่ระบบไม่สำเร็จ: "+(err.message||err.code));}
}
async function adminLogout(){await auth.signOut();await auth.signInAnonymously();}

async function downloadCSV(){
 const snapshot=await db.collection(collectionPath).get();
 let csv="\uFEFFชื่อ,แผนก,รายการ,สถานะ,เวลา\n";
 snapshot.forEach(docSnap=>{
  const d=docSnap.data();
  const items=Array.isArray(d.itemsList)?d.itemsList.map(it=>`${it.name} (${it.qty})`).join(" / "):"";
  const time=d.timestamp?.toMillis?new Date(d.timestamp.toMillis()).toLocaleString("th-TH"):"";
  csv+=`"${String(d.requesterName||"").replace(/"/g,'""')}","${String(d.department||"").replace(/"/g,'""')}","${items.replace(/"/g,'""')}","${d.complete?"ครบ":"รอดำเนินการ"}","${time}"\n`;
 });
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="supply.csv";a.click();URL.revokeObjectURL(url);
}
