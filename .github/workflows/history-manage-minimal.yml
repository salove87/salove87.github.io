name: Add history manage button
on:
  push:
    branches: [history-manage-minimal]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch leave history UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('leave-form-nano.html')
          s=p.read_bytes().decode('utf-8')
          old='<tr><th class="p-3">วันที่</th><th class="p-3">ประเภท</th><th class="p-3 text-center">จำนวน</th><th class="p-3">เหตุผล</th><th class="p-3">ผู้อนุมัติ</th></tr>'
          new='<tr><th class="p-3">วันที่</th><th class="p-3">ประเภท</th><th class="p-3 text-center">จำนวน</th><th class="p-3">เหตุผล</th><th class="p-3">ผู้อนุมัติ</th><th class="p-3 text-center no-print">จัดการ</th></tr>'
          assert old in s, 'history table header not found'
          s=s.replace(old,new,1)
          old2="historyTableBody.innerHTML='<tr><td colspan=\"5\" class=\"p-5 text-center\">กำลังโหลดประวัติ...</td></tr>';"
          new2="historyTableBody.innerHTML='<tr><td colspan=\"6\" class=\"p-5 text-center\">กำลังโหลดประวัติ...</td></tr>';"
          assert old2 in s, 'loading row not found'
          s=s.replace(old2,new2,1)
          old3='${r.reason||\'-\'}</td><td class="p-3">${r.approver||\'-\'}</td></tr>`; }).join(\'\'):\'<tr><td colspan="5" class="p-5 text-center" style="color:var(--ink-soft);">ยังไม่มีประวัติการลา</td></tr>\';'
          new3='${r.reason||\'-\'}</td><td class="p-3">${r.approver||\'-\'}</td><td class="p-3 text-center no-print"><button type="button" class="history-manage-btn px-3 py-2 rounded-lg" data-leave-id="${escapeHtml(r.id||\'\')}" style="background:#EEF2FF;color:#1D4ED8;font-weight:700;white-space:nowrap;">⚙️ จัดการ</button></td></tr>`; }).join(\'\'):\'<tr><td colspan="6" class="p-5 text-center" style="color:var(--ink-soft);">ยังไม่มีประวัติการลา</td></tr>\';\n        historyTableBody.querySelectorAll(\'.history-manage-btn\').forEach(btn=>btn.addEventListener(\'click\',()=>{ const row=rows.find(x=>String(x.id)===String(btn.dataset.leaveId)); if(row) openLeaveActionMenu(row); }));'
          assert old3 in s, 'history row template not found'
          s=s.replace(old3,new3,1)
          p.write_bytes(s.encode('utf-8'))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leave-form-nano.html
          git diff --cached --quiet || git commit -m "Add manage button to employee leave history"
          git push
