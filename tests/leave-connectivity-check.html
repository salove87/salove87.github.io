<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Leave form connection check</title></head><body><h1>ตรวจสอบการเชื่อมต่อแบบไม่บันทึกข้อมูล</h1><button id="run" type="button">เริ่มทดสอบ</button><pre id="status">พร้อมทดสอบ</pre><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, collection, doc, query, where, getDocFromServer, getDocsFromServer, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyB9Gzqb2sgYdhg0G5_ivc_GemeQp0yUy8Y",
      authDomain: "leave-form-cd603.firebaseapp.com",
      projectId: "leave-form-cd603",
      storageBucket: "leave-form-cd603.firebasestorage.app",
      messagingSenderId: "180376619525",
      appId: "1:180376619525:web:8270c8a3a0ec5196e5ea6c",
      measurementId: "G-V9Z02K9LT6"
    };
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
document.getElementById("run").addEventListener("click",async()=>{
 const status=document.getElementById("status"), button=document.getElementById("run");
 button.disabled=true;status.textContent="กำลังตรวจสอบ";
 try {
  await signInAnonymously(auth);
  const synthetic="TEST-"+crypto.randomUUID(), guard=doc(db,"leave_overlap_guards",synthetic);
  const before=await getDocFromServer(guard);
  if(before.exists()) throw new Error("Unexpected guard fixture");
  const history=await getDocsFromServer(query(collection(db,"leave_requests"),where("empId","==",synthetic)));
  if(!history.empty) throw new Error("Unexpected employee fixture");
  let rollback=false;
  try { await runTransaction(db,async tx=>{const s=await tx.get(guard);if(s.exists())throw new Error("Unexpected guard transaction");tx.set(guard,{revision:1,updatedAt:serverTimestamp()});throw new Error("EXPECTED_TEST_ROLLBACK");}); }
  catch(e){ if(e.message!=="EXPECTED_TEST_ROLLBACK") throw e; rollback=true; }
  if(!rollback || (await getDocFromServer(guard)).exists()) throw new Error("Rollback verification failed");
  status.textContent="PASS: Firebase SDK, server reads, transaction rollback; no test records saved.";
 } catch(e){status.textContent="FAIL: "+String(e.code||e.message||e);}
 finally {button.disabled=false;}
});
</script></body></html>
